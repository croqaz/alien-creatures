<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Creatures Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; }

    canvas#game {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    }

    #ui-panel {
      position: fixed;
      top: 8px; right: 8px;
      width: 220px;
      max-height: calc(100vh - 16px);
      overflow-y: auto;
      background: rgba(15, 15, 35, 0.92);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      color: #e2e8f0;
      font-size: 12px;
      z-index: 10;
      pointer-events: auto;
    }
    #ui-panel h2 { font-size: 14px; margin-bottom: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    #ui-panel h3 { font-size: 11px; margin: 8px 0 4px; color: #64748b; text-transform: uppercase; }
    #ui-panel .section { margin-bottom: 6px; }
    #ui-panel button {
      display: inline-block;
      margin: 2px;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: transform 0.1s;
    }
    #ui-panel button:hover { transform: scale(1.05); }
    #ui-panel button:active { transform: scale(0.95); }

    .mode-bar { display: flex; flex-wrap: wrap; gap: 2px; }
    .mode-btn {
      flex: 1; min-width: 42px;
      background: #334155 !important;
      color: #94a3b8 !important;
      border-color: #475569 !important;
      font-size: 9px !important;
      padding: 4px 3px !important;
    }
    .mode-btn.active {
      background: #3b82f6 !important;
      color: #fff !important;
      border-color: #60a5fa !important;
    }

    .spawn-btn {
      font-size: 10px !important;
      padding: 3px 6px !important;
    }

    .stats {
      margin-top: 8px;
      padding: 6px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.5;
    }
    .stats .stat-row { padding: 1px 0; }
    .stats .action { color: #fbbf24; font-style: italic; }
    .dim { color: #64748b; }

    .slider-container {
      display: flex; align-items: center; gap: 6px; margin-top: 4px;
    }
    .slider-container input[type=range] { flex: 1; accent-color: #60a5fa; }
    #spawn-rate-label { font-size: 10px; color: #94a3b8; white-space: nowrap; }

    #tooltip {
      position: fixed;
      display: none;
      background: rgba(0,0,0,0.85);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-line;
      pointer-events: none;
      z-index: 20;
      border: 1px solid #475569;
      max-width: 200px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-panel"></div>
  <div id="tooltip"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
